services:
  api:
    build:
      context: .
      args:
        APP_COMMIT: ${APP_COMMIT:-development}
        VITE_VOICE_INPUT_ENABLED: ${VITE_VOICE_INPUT_ENABLED:-true}
    env_file: .env
    environment:
      MINERU_URL: ${MINERU_URL:-http://mineru:8000}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      mineru:
        condition: service_healthy
    networks:
      - private
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:17.2-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: secure_rag
      POSTGRES_USER: secure_rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secure_rag -d secure_rag"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'" ]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  mineru-models:
    image: ${MINERU_IMAGE:-mineru:3.2.1}
    build:
      context: .
      dockerfile: Dockerfile.mineru
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        if [ ! -s "$${MINERU_TOOLS_CONFIG_JSON}" ]; then
          mineru-models-download -s huggingface -m pipeline
        fi
    environment:
      HF_HOME: /opt/mineru/huggingface
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "600"
      MINERU_TOOLS_CONFIG_JSON: /opt/mineru/mineru.json
    volumes:
      - mineru-models:/opt/mineru
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    restart: "no"

  mineru:
    image: ${MINERU_IMAGE:-mineru:3.2.1}
    build:
      context: .
      dockerfile: Dockerfile.mineru
    entrypoint: mineru-api
    command: ["--host", "0.0.0.0", "--port", "8000"]
    environment:
      MINERU_MODEL_SOURCE: local
      MINERU_TOOLS_CONFIG_JSON: /opt/mineru/mineru.json
      HF_HOME: /opt/mineru/huggingface
      CUDA_VISIBLE_DEVICES: ${MINERU_GPU_DEVICE:-0}
    volumes:
      - mineru-models:/opt/mineru:ro
    depends_on:
      mineru-models:
        condition: service_completed_successfully
    networks:
      - private
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 120s
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${MINERU_GPU_DEVICE:-0}"]
              capabilities: [gpu]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  private:

volumes:
  postgres-data:
  qdrant-data:
  mineru-models:
