services:
  api:
    build: .
    env_file: .env
    environment:
      MINERU_URL: ${MINERU_URL:-http://mineru:8000}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - private
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:17.2-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: secure_rag
      POSTGRES_USER: secure_rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secure_rag -d secure_rag"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'" ]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  mineru:
    image: ${MINERU_IMAGE:-mineru:3.2.1}
    profiles: ["mineru"]
    entrypoint: mineru-api
    command: ["--host", "0.0.0.0", "--port", "8000"]
    environment:
      MINERU_MODEL_SOURCE: local
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - private
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  private:

volumes:
  postgres-data:
  qdrant-data:
