[project]
name = "secure-document-rag"
version = "0.4.9"
description = "Self-hosted, multi-tenant RAG for regulated documents"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic-settings==2.15.0",
    "pypdf==6.17.0",
    "python-docx==1.2.0",
    "qdrant-client==1.19.0",
    "sqlalchemy[asyncio]==2.0.52",
    "asyncpg==0.31.0",
    "uvicorn[standard]==0.52.4",
    "pillow==12.3.0",
    "alembic==1.19.1",
    "argon2-cffi==25.1.0",
    "pyjwt==2.13.0",
    "h2==4.4.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
