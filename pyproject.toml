[project]
name = "secure-document-rag"
version = "0.7.2"
description = "Self-hosted, multi-tenant RAG for regulated documents"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.163.1",
    "httpx==0.28.1",
    "pydantic-settings==2.16.3",
    "pypdf==7.1.0",
    "python-docx==1.2.0",
    "qdrant-client==1.20.0",
    "sqlalchemy[asyncio]==2.1.9",
    "asyncpg==0.32.0",
    "uvicorn[standard]==0.54.0",
    "pillow==13.0.0",
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "pyjwt[crypto]==2.15.1",
    "h2==4.4.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
