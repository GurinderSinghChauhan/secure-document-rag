name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.6.5"
          enable-cache: false

      - name: Increment version and create semantic version tag
        id: version
        run: |
          validated_sha="$(git rev-parse HEAD)"
          version="$(cat VERSION)"
          tag="v$version"
          existing_sha="$(git rev-list -n 1 "$tag" 2>/dev/null || true)"
          if [ -n "$existing_sha" ] && [ "$existing_sha" != "$validated_sha" ]; then
            python tools/version.py --bump auto --since "$tag"
            version="$(cat VERSION)"
            tag="v$version"
            if git rev-parse --verify --quiet "$tag" >/dev/null; then
              echo "Calculated version $version already exists." >&2
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add VERSION pyproject.toml uv.lock CHANGELOG.md
            git commit -m "chore(release): v$version [skip ci]"
            git push origin HEAD:main
          fi
          release_sha="$(git rev-parse HEAD)"
          if ! git rev-parse --verify --quiet "$tag" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$release_sha" -m "$tag"
            git push origin "$tag"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Sign in to GitHub Container Registry
        if: steps.version.outputs.publish == 'true'
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        if: steps.version.outputs.publish == 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build \
            --build-arg APP_COMMIT="${{ steps.version.outputs.release_sha }}" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=${{ steps.version.outputs.release_sha }}" \
            --label "org.opencontainers.image.version=$version" \
            -t "$image:$version" \
            -t "$image:latest" .
          docker push "$image:$version"
          docker push "$image:latest"

      - name: Create GitHub release
        if: steps.version.outputs.publish == 'true'
        run: gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1 || gh release create "${{ steps.version.outputs.tag }}" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
