name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Test, validate, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.6.5"
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --frozen

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check

      - name: Run browser navigation tests
        working-directory: frontend
        run: |
          npx playwright install chromium --with-deps
          npm run test:e2e

      - name: Validate version and lock file
        run: |
          uv run python tools/version.py --check
          uv lock --check

      - name: Run test suite
        run: |
          uv run pytest -q

      - name: Run static checks
        run: |
          uv run python -m compileall -q app tests tools
          git diff --check

      - name: Verify migration graph
        run: test "$(uv run alembic heads | wc -l | tr -d ' ')" = "1"

      - name: Build API image
        run: docker build --build-arg APP_COMMIT="$GITHUB_SHA" -t secure-document-rag:ci .
