name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Test, validate, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.6.5"
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --frozen

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check

      - name: Run browser navigation tests
        working-directory: frontend
        run: |
          npx playwright install chromium --with-deps
          npm run test:e2e

      - name: Validate version and lock file
        run: |
          uv run python tools/version.py --check
          uv lock --check

      - name: Run test suite
        run: |
          uv run pytest -q

      - name: Run static checks
        run: |
          uv run python -m compileall -q app tests tools
          git diff --check

      - name: Verify migration graph
        run: test "$(uv run alembic heads | wc -l | tr -d ' ')" = "1"

      - name: Build API image
        run: docker build --build-arg APP_COMMIT="$GITHUB_SHA" -t secure-document-rag:ci .

  release:
    name: Tag and publish release
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.6.5"
          enable-cache: false

      - name: Increment version and create semantic version tag
        id: version
        run: |
          version="$(cat VERSION)"
          tag="v$version"
          existing_sha="$(git rev-list -n 1 "$tag" 2>/dev/null || true)"
          if [ -n "$existing_sha" ] && [ "$existing_sha" != "$GITHUB_SHA" ]; then
            python tools/version.py --bump auto --since "$tag"
            version="$(cat VERSION)"
            tag="v$version"
            if git rev-parse --verify --quiet "$tag" >/dev/null; then
              echo "Calculated version $version already exists." >&2
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add VERSION pyproject.toml uv.lock CHANGELOG.md
            git commit -m "chore(release): v$version [skip ci]"
            git push origin HEAD:main
          fi
          release_sha="$(git rev-parse HEAD)"
          if ! git rev-parse --verify --quiet "$tag" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$release_sha" -m "$tag"
            git push origin "$tag"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Sign in to GitHub Container Registry
        if: steps.version.outputs.publish == 'true'
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        if: steps.version.outputs.publish == 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build \
            --build-arg APP_COMMIT="${{ steps.version.outputs.release_sha }}" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=${{ steps.version.outputs.release_sha }}" \
            --label "org.opencontainers.image.version=$version" \
            -t "$image:$version" \
            -t "$image:latest" .
          docker push "$image:$version"
          docker push "$image:latest"

      - name: Create GitHub release
        if: steps.version.outputs.publish == 'true'
        run: gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1 || gh release create "${{ steps.version.outputs.tag }}" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
